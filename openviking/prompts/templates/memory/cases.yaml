memory_type: cases
description: |
  Language policy: generated natural-language text must use {{ language }}. If the source is multilingual, use the current task user's primary language as {{ language }}; if unclear, use the latest user message language. Preserve stable code-like tokens, tool/API names, enum values, and output formats. Generalize one-run IDs, names, paths, dates, amounts, percentages, counts, and filenames into semantic parameter roles. When updating an existing case, prefer its existing name and language style to avoid translated duplicates.

  A reusable task-family Case extracted from a real session commit.

  Extract ONLY when the conversation contains a concrete user task plus enough assistant execution,
  tool-use evidence, or final result to define what a good future rollout should do.
  Skip pure chit-chat, simple factual Q&A, or fragments with no observable task outcome.

  A Case groups independent sessions that share the same goal, subject, action pattern, and
  observable completion boundary. Split compound tasks into independent Case units. Exact IDs,
  dates, amounts, paths, and other one-run parameters belong to trajectory evidence, not identity.

  The case is not an Experience instruction and must not copy evaluator rubrics, weights, hidden
  answers, or benchmark-only criteria. It describes a reusable task family and links to reusable
  Experiences.

directory: "viking://user/{{ user_space }}/memories/cases"
filename_template: "{{ case_name }}.md"
enabled: true
peer_enabled: false
content_template: |
  # {{ case_name }}

  ## Task Signature
  {{ task_signature }}

  ## Stable Preconditions
  {{ input }}

  ## Situation
  {{ situation }}

  ## Situation
  {{ situation }}

  ## Linked Experiences
  {%- for link in links or [] %}
  {%- set target_uri = link.to_uri or "" %}
  {%- if "/memories/experiences/" in target_uri %}
  - [{{ uri_basename(target_uri) }}]({{ link_target(target_uri) }})
  {%- endif %}
  {%- endfor %}
embedding_template: |-
  {{ case_name }}

  {{ case_identity }}

  {{ task_signature }}

  {{ input }}

  {{ situation }}
overview_template: |-
  # Cases Overview
  {% for item in items %}
  - [{{ item.file_content.case_name }}](./{{ item.file_name }}) — {{ item.file_content.task_signature }}
  {% endfor %}

fields:
  - name: case_name
    type: string
    description: |
      Short stable name for this reusable task family.
      Must be written in {{ language }}.
      {% if language == 'en' %}Use lowercase snake_case, max 5 words.{% else %}Use a concise noun phrase, max 15 characters.{% endif %}
      Name the task boundary, not the whole conversation.
    merge_op: immutable

  - name: case_identity
    type: string
    description: |
      Compact JSON object string used internally to decide whether independent sessions belong
      to the same Case. Required keys:
      {"goal":"final desired state","subject":"object type and scope","action_pattern":"core reusable behavior","success_boundary":"observable done state","context_constraints":["stable strategy-changing preconditions"],"facets":{"domain":"optional","channel":"optional","output_format":"optional","tools":"optional"}}
      Generalize exact IDs, dates, amounts, paths, counts, and names. success_boundary must be
      inferred from the user's task and observable execution outcome; never copy evaluator rubric
      text, weights, hidden answers, or benchmark criteria. Do not add parameter_slots or store
      current parameter values in this field. Describe only the stable role of a parameter when it
      changes strategy.
    merge_op: immutable

  - name: task_signature
    type: string
    description: |
      Semantic task signature for retrieval and grouping.
      Write generated natural-language text in {{ language }}.
      Describe the reusable task intent, object/effect boundary, and success condition in one sentence.
      Generalize private identifiers, exact IDs, names, amounts, dates, and paths.
    merge_op: replace

  - name: input
    type: string
    description: |
      Compact JSON object string describing the executable case input.
      JSON keys must remain stable English identifiers; generated string values should use {{ language }}.
      Preserve only stable tool names, enum values, and structured literals that change strategy.
      Include stable preconditions and variable parameter types that affect strategy. Do not retain
      exact one-run IDs, names, dates, amounts, percentages, counts, paths, or filenames. Every
      one-run value that affects execution must instead be represented by a concise semantic role
      in variable_types. Always return variable_types as a list; use an empty list when there are
      no variable parameters. Do not add a parameter_slots field.
      Example: {"summary":"处理重复预订并保留有效订单","preconditions":["存在多个相似订单候选"],"variable_types":["订单标识","时间范围"]}
    merge_op: replace

  - name: rubric
    type: string
    description: |
      Internal compact JSON object defining reusable observable success criteria.
      JSON keys must remain stable English identifiers; generated string values should use {{ language }} while preserving exact tool names, required literals, and observable evaluation labels.
      Required shape:
      {"name":"...","description":"...","criteria":[{"name":"...","description":"observable success condition","required":true,"weight":1.0}]}
      Criteria must be inferred from the user request and rollout evidence. Never copy evaluator
      rubric text, weights, hidden answers, or benchmark-only criteria.
      Use 1-5 criteria. Weight values should be positive.
    merge_op: replace

  - name: evidence
    type: string
    description: |
      Brief generalized evidence from the commit conversation explaining why this case is useful.
      Write generated natural-language text in {{ language }}.
      Do not include private raw identifiers, exact IDs, personal contact values, or full tool payloads.
    merge_op: replace

  - name: situation
    type: string
    description: |
      Generalized, reusable scenario description for semantic retrieval and embedding.
      Write generated natural-language text in {{ language }}.
      Describe the task category, user intent, key constraints, and object/effect boundary in 1-3 sentences.
      Keep only conditions shared across independent sessions; do not retain transient tool state.
      Generalize all private identifiers: replace exact reservation IDs, user names, user IDs, dates,
      amounts, flight numbers, and airport codes with their semantic roles (e.g. "a reservation",
      "the user", "a future date", "a business-class booking").
      This field is the primary embedding source; it must be semantically rich and specific to
      the task pattern, not to the individual instance. Write from the agent's perspective using
      third-person ("the customer wants…"), never second-person ("you want…").
    merge_op: replace

  - name: case_status
    type: string
    description: |
      System-managed lifecycle state: draft, promoted, degraded, or archived.
    merge_op: replace
    init_value: draft
    system_managed: true

  - name: source_count
    type: int64
    description: |
      System-managed count of independent source sessions.
    merge_op: replace
    init_value: "0"
    system_managed: true

  - name: last_compacted_source_count
    type: int64
    description: |
      System-managed source count at the most recent full body compaction.
    merge_op: replace
    init_value: "0"
    system_managed: true

  - name: last_compacted_version
    type: int64
    description: |
      System-managed memory version produced by the most recent full body compaction.
    merge_op: replace
    init_value: "0"
    system_managed: true
